name: tax_collect
description: "Application de collecte de taxe"
version: 1.3.2+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  retrofit: ^4.9.1
  get_storage: ^2.1.1
  currency_formatter: ^2.3.0
  pretty_dio_logger: ^1.4.0
  flutter_riverpod: ^3.0.3
  gap: ^3.0.1
  intl: ^0.20.2
  event_bus: ^2.0.1
  location: ^8.0.1
  shimmer: ^3.0.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2

  flutter_localizations:
    sdk: flutter
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_gen_runner:
  build_runner:
  retrofit_generator: ^10.0.1
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/hors-taxe.png"
  min_sdk_android: 21 # android min sdk min:16, default 21